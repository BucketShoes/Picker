<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15131c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Everyone holds a finger on the screen and one player is picked at random to go first.">
<title>First Player Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
/* One full-screen canvas table: fingers become rings, status floats on top. Single dark look by choice. */
:root {
  --bg: #15131c;
  --bg-2: #1e1b28;
  --fg: #f3efe6;
  --muted: #9a93a8;
  --ring: #ffffff;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: radial-gradient(120% 80% at 50% 40%, var(--bg-2), var(--bg));
  color: var(--fg);
  font-family: var(--display);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.status {
  position: fixed; left: 0; right: 0;
  text-align: center; pointer-events: none;
  padding: 0 24px;
  transition: opacity .25s ease, top .35s ease, transform .35s ease;
}
#intro { top: 50%; transform: translateY(-50%); }
#intro h1 {
  font-size: clamp(2.2rem, 11vw, 4rem); font-weight: 800; line-height: 1;
  margin: 0 0 .6rem; letter-spacing: -0.02em; text-wrap: balance;
}
#intro p { margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.45; text-wrap: balance; }
#intro .small { margin-top: 1.4rem; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }
#live {
  top: calc(env(safe-area-inset-top, 0px) + 20px);
  font-size: 1.15rem; font-weight: 500; color: var(--fg);
  font-variant-numeric: tabular-nums;
}
#live b { font-weight: 800; }
.off { opacity: 0; }
@media (prefers-reduced-motion: reduce) { .status { transition: none; } }
</style>
</head>
<body>

<canvas id="c" aria-label="Touch area"></canvas>
<div id="intro" class="status">
  <h1>Who goes first?</h1>
  <p>Everyone press and hold one finger on the screen.<br>A player is picked 3 seconds after the last finger lands.</p>
  <p class="small" id="cap"></p>
</div>
<div id="live" class="status off"></div>

<script>
(() => {
  const HOLD_MS = 3000;     // wait after the last change before picking
  const MIN_PLAYERS = 2;
  const R = 46;             // finger ring radius, CSS px
  const COLORS = ['#ff5d6c', '#ffb627', '#3ddc97', '#4cc9f0', '#b794ff', '#ff7ac6', '#f4ee5a', '#ff8f4a', '#7ee0d2', '#a3e635', '#e2e2e2', '#6c8cff'];

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const intro = document.getElementById('intro');
  const live = document.getElementById('live');
  const cap = document.getElementById('cap');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const maxTP = navigator.maxTouchPoints || 0;
  // Browsers often under-report (e.g. 5) while the hardware tracks 10, so treat the number as a floor.
  cap.textContent = maxTP > 1
    ? `This device supports ${maxTP} touches` + (maxTP < 10 ? ', but might work with more' : '')
    : 'Needs a multi-touch screen';

  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  // id -> { x, y, color, born, gone }
  const fingers = new Map();
  let state = 'idle';        // idle | waiting | picking | done
  let lastChange = 0;
  let candidates = [];       // finger objects frozen at pick time
  let winner = null;
  let schedule = [];         // [{t, idx}] roulette highlight steps
  let pickStart = 0, doneAt = 0, allLiftedAt = 0;

  const now = () => performance.now();
  const liveFingers = () => [...fingers.values()].filter(f => !f.gone);

  function freeColor() {
    const used = new Set(liveFingers().map(f => f.color));
    const free = COLORS.filter(c => !used.has(c));
    const pool = free.length ? free : COLORS;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

  function onDown(e) {
    e.preventDefault();
    if (state === 'picking' || state === 'done') return;   // round is locked
    const p = pos(e);
    fingers.set(e.pointerId, { x: p.x, y: p.y, color: freeColor(), born: now(), gone: 0 });
    state = 'waiting';
    lastChange = now();
    requestWake();
  }
  function onMove(e) {
    const f = fingers.get(e.pointerId);
    if (!f || f.gone) return;
    const p = pos(e); f.x = p.x; f.y = p.y;
  }
  function onUp(e) {
    const f = fingers.get(e.pointerId);
    if (!f || f.gone) return;
    f.gone = now();
    if (state === 'waiting') lastChange = f.gone;            // someone let go: restart the wait
  }

  cv.addEventListener('pointerdown', onDown);
  addEventListener('pointermove', onMove);
  addEventListener('pointerup', onUp);
  addEventListener('pointercancel', onUp);
  // Stop the browser from scrolling, zooming or opening menus while fingers are down.
  const block = e => e.preventDefault();
  document.addEventListener('touchstart', block, { passive: false });
  document.addEventListener('touchmove', block, { passive: false });
  document.addEventListener('contextmenu', block);
  document.addEventListener('gesturestart', block);

  function randInt(n) {
    try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
    catch { return Math.floor(Math.random() * n); }
  }

  function startPick() {
    const list = liveFingers();
    // Order players around the table so the roulette travels in a circle.
    const cx = list.reduce((s, f) => s + f.x, 0) / list.length;
    const cy = list.reduce((s, f) => s + f.y, 0) / list.length;
    candidates = list.sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));
    const wi = randInt(candidates.length);
    winner = candidates[wi];
    pickStart = now();
    schedule = [];
    if (!reduceMotion) {
      // Steps slow down as they go, and the final step lands on the winner.
      const times = []; let t = 0, gap = 55;
      while (t < 1500) { times.push(t); t += gap; gap *= 1.16; }
      const k = times.length, n = candidates.length;
      times.forEach((tt, i) => schedule.push({ t: tt, idx: (((wi - (k - 1 - i)) % n) + n) % n }));
    }
    const total = schedule.length ? schedule[schedule.length - 1].t + 260 : 0;
    state = 'picking';
    doneAt = pickStart + total;
  }

  function finish() {
    state = 'done';
    doneAt = now();
    allLiftedAt = 0;
    try { navigator.vibrate && navigator.vibrate([40, 60, 120]); } catch {}
  }

  function reset() {
    fingers.clear(); candidates = []; winner = null; schedule = [];
    state = 'idle';
  }

  // Wake lock keeps the screen on while people hold; optional.
  let wakeLock = null;
  async function requestWake() {
    if (wakeLock || !('wakeLock' in navigator)) return;
    try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch {}
  }

  const easeOutBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeOut = t => 1 - Math.pow(1 - t, 3);

  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
  }

  function drawFinger(f, t, opts) {
    const { scale = 1, alpha = 1, glow = 0, progress = -1, label = '' } = opts;
    const pop = reduceMotion ? 1 : easeOutBack(clamp((t - f.born) / 260, 0, 1));
    const breathe = 1 + Math.sin((t - f.born) / 260) * 0.035;
    const r = R * scale * pop * breathe;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (glow > 0) { ctx.shadowColor = f.color; ctx.shadowBlur = 40 * glow; }
    ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI * 2);
    ctx.fillStyle = hexA(f.color, 0.28 + glow * 0.3); ctx.fill();
    ctx.lineWidth = 7; ctx.strokeStyle = f.color; ctx.stroke();
    ctx.shadowBlur = 0;
    // Landing ripple so each new finger visibly registers.
    const age = t - f.born;
    if (!reduceMotion && age < 600) {
      const k = age / 600;
      ctx.beginPath(); ctx.arc(f.x, f.y, r + 10 + k * 50, 0, Math.PI * 2);
      ctx.lineWidth = 3 * (1 - k); ctx.strokeStyle = hexA(f.color, 1 - k); ctx.stroke();
    }
    if (progress >= 0) {
      ctx.beginPath(); ctx.arc(f.x, f.y, r + 15, 0, Math.PI * 2);
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.stroke();
      ctx.beginPath(); ctx.arc(f.x, f.y, r + 15, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
      ctx.lineCap = 'round'; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    }
    if (label) {
      ctx.font = '800 22px ' + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillStyle = '#ffffff';
      const ly = f.y - r - 22 < 30 ? f.y + r + 44 : f.y - r - 18;   // flip below if too close to the top
      ctx.fillText(label, f.x, ly);
    }
    ctx.restore();
  }

  function setStatus(introOn, text) {
    intro.classList.toggle('off', !introOn);
    live.classList.toggle('off', !text);
    if (text && live.innerHTML !== text) live.innerHTML = text;
  }

  function frame() {
    const t = now();
    ctx.clearRect(0, 0, W, H);

    if (state === 'waiting') {
      const lv = liveFingers();
      // Drop faded-out fingers.
      for (const [id, f] of fingers) if (f.gone && t - f.gone > 320) fingers.delete(id);
      if (lv.length === 0 && fingers.size === 0) { state = 'idle'; }
      const ready = lv.length >= MIN_PLAYERS;
      const progress = ready ? clamp((t - lastChange) / HOLD_MS, 0, 1) : -1;
      for (const f of fingers.values()) {
        if (f.gone) {
          const k = clamp((t - f.gone) / 320, 0, 1);
          drawFinger(f, t, { scale: 1 - 0.4 * k, alpha: 1 - k });
        } else drawFinger(f, t, { progress });
      }
      const secs = Math.max(0, Math.ceil((HOLD_MS - (t - lastChange)) / 1000));
      setStatus(false, ready
        ? `<b>${lv.length}</b> players &middot; keep holding &middot; ${secs}`
        : (lv.length === 1 ? 'Waiting for more players&hellip;' : ''));
      if (ready && progress >= 1) startPick();
    }

    if (state === 'picking') {
      let idx = -1;
      for (const s of schedule) if (t - pickStart >= s.t) idx = s.idx;
      candidates.forEach((f, i) => {
        const on = i === idx;
        drawFinger(f, t, { scale: on ? 1.25 : 0.9, alpha: on ? 1 : 0.35, glow: on ? 1 : 0 });
      });
      setStatus(false, 'Choosing&hellip;');
      if (t >= doneAt) finish();
    }

    if (state === 'done') {
      const k = easeOut(clamp((t - doneAt) / 700, 0, 1));
      // Wash the table in the winner's color.
      const reach = Math.hypot(W, H);
      const g = ctx.createRadialGradient(winner.x, winner.y, 0, winner.x, winner.y, reach * (0.25 + 0.75 * k));
      g.addColorStop(0, hexA(winner.color, 0.45 * k));
      g.addColorStop(1, hexA(winner.color, 0));
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      if (!reduceMotion) {
        const pulse = ((t - doneAt) % 1400) / 1400;
        ctx.beginPath(); ctx.arc(winner.x, winner.y, R * 1.6 + pulse * 120, 0, Math.PI * 2);
        ctx.lineWidth = 4 * (1 - pulse); ctx.strokeStyle = hexA(winner.color, 1 - pulse); ctx.stroke();
      }
      for (const f of candidates) {
        if (f === winner) continue;
        drawFinger(f, t, { scale: 0.9 - 0.3 * k, alpha: 0.35 - 0.25 * k });
      }
      drawFinger(winner, t, { scale: 1.25 + 0.35 * k, glow: 1, label: 'FIRST' });

      const lv = liveFingers().length;
      setStatus(false, lv ? 'Lift all fingers to play again' : 'Starting over&hellip;');
      if (!lv) {
        if (!allLiftedAt) allLiftedAt = t;
        if (t - allLiftedAt > 1400 && t - doneAt > 1500) reset();
      } else allLiftedAt = 0;
    }

    if (state === 'idle') setStatus(true, '');
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
