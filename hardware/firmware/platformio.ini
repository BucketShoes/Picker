; Picker box firmware: Arduino (MiniCore) under PlatformIO. See README.md.
;   pio run                 build the default (328PB)
;   pio run -e 328p         build for the 328P
[platformio]
default_envs = 328pb

[env]
platform = atmelavr
framework = arduino
; Runs at 4 MHz: the internal 8 MHz RC, divided by 2 in code at start-up (src/board.cpp), whatever the CKDIV8 fuse says.
; 4 MHz is in spec down to 1.8 V, so a tired cell under LED load is fine.
board_build.f_cpu = 4000000L
board_hardware.oscillator = internal
board_hardware.bod = disabled
board_hardware.uart = no_bootloader
board_hardware.eesave = yes
build_flags = -Wall -Wextra
; Upload is over ISP (JISP holes) from the ESP32-C6 programmer; not set up yet. Factory-fresh chips run at 1 MHz until
; this firmware starts, so the first flash needs a slow ISP clock (avrdude -B 8 or slower).

[env:328pb]
board = ATmega328PB

[env:328p]
board = ATmega328P
